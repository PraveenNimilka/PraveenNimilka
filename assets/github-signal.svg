<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="475"
  viewBox="0 0 1100 475"
  role="img"
  aria-labelledby="title desc"
>

  <title id="title">
    PRAVEEN.OS GitHub Signal
  </title>

  <desc id="desc">
    Live public GitHub statistics for Praveen Nimilka.
  </desc>


  <defs>

    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >

      <stop
        offset="0%"
        stop-color="#090d12"
      />

      <stop
        offset="100%"
        stop-color="#0d1117"
      />

    </linearGradient>


    <linearGradient
      id="signal"
      x1="0"
      x2="1"
    >

      <stop
        offset="0%"
        stop-color="#39ff88"
        stop-opacity="0"
      />

      <stop
        offset="50%"
        stop-color="#39ff88"
        stop-opacity=".85"
      />

      <stop
        offset="100%"
        stop-color="#39ff88"
        stop-opacity="0"
      />

    </linearGradient>


    <filter
      id="glow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >

      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>

        <feMergeNode
          in="blur"
        />

        <feMergeNode
          in="SourceGraphic"
        />

      </feMerge>

    </filter>

  </defs>


  <!-- ==================================================
       BACKGROUND
  =================================================== -->

  <rect
    x="1"
    y="1"
    width="1098"
    height="473"
    rx="16"
    fill="url(#background)"
    stroke="#30363d"
    stroke-width="2"
  />


  <!-- MOVING TOP SIGNAL -->

  <rect
    x="-300"
    y="1"
    width="300"
    height="2"
    fill="url(#signal)"
  >

    <animate
      attributeName="x"
      from="-300"
      to="1100"
      dur="5s"
      repeatCount="indefinite"
    />

  </rect>


  <g
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
  >


    <!-- ==================================================
         HEADER
    =================================================== -->

    <circle
      cx="80"
      cy="58"
      r="5"
      fill="#39ff88"
      filter="url(#glow)"
    >

      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="1.7s"
        repeatCount="indefinite"
      />

    </circle>


    <text
      x="99"
      y="63"
      fill="#39ff88"
      font-size="12"
      letter-spacing="2"
    >
      GITHUB SIGNAL // LIVE
    </text>


    <text
      x="1018"
      y="62"
      text-anchor="end"
      fill="#484f58"
      font-size="9"
      letter-spacing="1"
    >
      PRAVEEN.OS
    </text>


    <!-- ==================================================
         COMMAND
    =================================================== -->

    <text
      x="80"
      y="108"
      fill="#39ff88"
      font-size="12"
    >
      praveen@github
    </text>


    <text
      x="202"
      y="108"
      fill="#7d8590"
      font-size="12"
    >
      :~$
    </text>


    <text
      x="236"
      y="108"
      fill="#d0d7de"
      font-size="12"
    >
      ./signal --live
    </text>


    <text
      x="1018"
      y="108"
      text-anchor="end"
      fill="#30363d"
      font-size="9"
    >
      2026-08-31 18:38 UTC
    </text>


    <line
      x1="80"
      y1="132"
      x2="1018"
      y2="132"
      stroke="#21262d"
    />


    <!-- ==================================================
         STAT LABELS
    =================================================== -->

    <text
      x="80"
      y="176"
      fill="#7d8590"
      font-size="9"
      letter-spacing="1.6"
    >
      PUBLIC REPOS
    </text>


    <text
      x="330"
      y="176"
      fill="#7d8590"
      font-size="9"
      letter-spacing="1.6"
    >
      TOTAL STARS
    </text>


    <text
      x="570"
      y="176"
      fill="#7d8590"
      font-size="9"
      letter-spacing="1.6"
    >
      FOLLOWERS
    </text>


    <text
      x="810"
      y="176"
      fill="#7d8590"
      font-size="9"
      letter-spacing="1.6"
    >
      SYSTEM
    </text>


    <!-- ==================================================
         STAT VALUES
    =================================================== -->

    <text
      x="80"
      y="218"
      fill="#f0f6fc"
      font-size="30"
      font-weight="700"
    >
      1
    </text>


    <text
      x="330"
      y="218"
      fill="#f0f6fc"
      font-size="30"
      font-weight="700"
    >
      0
    </text>


    <text
      x="570"
      y="218"
      fill="#f0f6fc"
      font-size="30"
      font-weight="700"
    >
      0
    </text>


    <text
      x="810"
      y="218"
      fill="#39ff88"
      font-size="28"
      font-weight="700"
    >
      ONLINE
    </text>


    <!-- ==================================================
         SUB SIGNAL
    =================================================== -->

    <text
      x="80"
      y="252"
      fill="#484f58"
      font-size="9"
      letter-spacing="1.4"
    >
      AI  /  SOFTWARE  /  SYSTEMS
    </text>


    <text
      x="1018"
      y="252"
      fill="#484f58"
      text-anchor="end"
      font-size="9"
    >
      FORKS // 0
    </text>


    <line
      x1="80"
      y1="268"
      x2="1018"
      y2="268"
      stroke="#21262d"
    />


    <!-- ==================================================
         RECENT PROJECTS
    =================================================== -->

    <text
      x="80"
      y="289"
      fill="#484f58"
      font-size="9"
      letter-spacing="1.6"
    >
      RECENT PUBLIC PROJECTS
    </text>


    
        <text
          x="82"
          y="325"
          fill="#7d8590"
          font-size="12"
        >
          No public project repositories detected.
        </text>

        <text
          x="82"
          y="350"
          fill="#484f58"
          font-size="10"
        >
          Private repositories are intentionally not exposed.
        </text>
        


    <!-- ==================================================
         FOOTER
    =================================================== -->

    <text
      x="80"
      y="447"
      fill="#30363d"
      font-size="9"
      letter-spacing="1.4"
    >
      DATA // GITHUB PUBLIC API
    </text>


    <text
      x="1018"
      y="447"
      fill="#30363d"
      text-anchor="end"
      font-size="9"
      letter-spacing="1"
    >
      PRIVATE DATA // NOT EXPOSED
    </text>


    <!-- BLINKING CURSOR -->

    <rect
      x="1012"
      y="417"
      width="7"
      height="14"
      fill="#39ff88"
    >

      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"
      />

    </rect>

  </g>

</svg>