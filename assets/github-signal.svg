<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="455"
  viewBox="0 0 1100 455"
>

  <defs>

    <linearGradient
      id="bg"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >

      <stop
        offset="0%"
        stop-color="#090d12"
      />

      <stop
        offset="100%"
        stop-color="#0d1117"
      />

    </linearGradient>


    <filter
      id="glow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >

      <feGaussianBlur
        stdDeviation="3"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect
    x="1"
    y="1"
    width="1098"
    height="453"
    rx="16"
    fill="url(#bg)"
    stroke="#30363d"
    stroke-width="2"
  />


  <g
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
  >


    <!-- HEADER -->

    <circle
      cx="80"
      cy="58"
      r="5"
      fill="#39ff88"
      filter="url(#glow)"
    >

      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="1.6s"
        repeatCount="indefinite"
      />

    </circle>


    <text
      x="98"
      y="62"
      fill="#39ff88"
      font-size="12"
      letter-spacing="2"
    >
      GITHUB SIGNAL // LIVE
    </text>


    <text
      x="1020"
      y="62"
      text-anchor="end"
      fill="#484f58"
      font-size="10"
    >
      PRAVEEN.OS
    </text>


    <!-- COMMAND -->

    <text
      x="78"
      y="108"
      fill="#39ff88"
      font-size="12"
    >
      praveen@github
    </text>


    <text
      x="200"
      y="108"
      fill="#7d8590"
      font-size="12"
    >
      :~$
    </text>


    <text
      x="232"
      y="108"
      fill="#d0d7de"
      font-size="12"
    >
      ./signal --live
    </text>


    <!-- DIVIDER -->

    <line
      x1="78"
      y1="132"
      x2="1020"
      y2="132"
      stroke="#21262d"
    />


    <!-- STAT 1 -->

    <text
      x="78"
      y="174"
      fill="#7d8590"
      font-size="10"
      letter-spacing="1.5"
    >
      REPOSITORIES
    </text>

    <text
      x="78"
      y="214"
      fill="#f0f6fc"
      font-size="30"
      font-weight="700"
    >
      1
    </text>


    <!-- STAT 2 -->

    <text
      x="330"
      y="174"
      fill="#7d8590"
      font-size="10"
      letter-spacing="1.5"
    >
      TOTAL STARS
    </text>

    <text
      x="330"
      y="214"
      fill="#f0f6fc"
      font-size="30"
      font-weight="700"
    >
      0
    </text>


    <!-- STAT 3 -->

    <text
      x="570"
      y="174"
      fill="#7d8590"
      font-size="10"
      letter-spacing="1.5"
    >
      FOLLOWERS
    </text>

    <text
      x="570"
      y="214"
      fill="#f0f6fc"
      font-size="30"
      font-weight="700"
    >
      0
    </text>


    <!-- STATUS -->

    <text
      x="805"
      y="174"
      fill="#7d8590"
      font-size="10"
      letter-spacing="1.5"
    >
      SYSTEM
    </text>

    <text
      x="805"
      y="214"
      fill="#39ff88"
      font-size="30"
      font-weight="700"
    >
      ONLINE
    </text>


    <!-- LANGUAGES -->

    <text
      x="78"
      y="250"
      fill="#484f58"
      font-size="10"
      letter-spacing="1.4"
    >
      BUILDING
    </text>


    <!-- RECENT -->

    <line
      x1="78"
      y1="267"
      x2="1020"
      y2="267"
      stroke="#21262d"
    />


    <text
      x="78"
      y="280"
      fill="#484f58"
      font-size="9"
      letter-spacing="1.5"
    >
      RECENTLY UPDATED
    </text>


    
            <text
              x="78"
              y="290"
              fill="#39ff88"
              font-size="11"
            >
              01
            </text>

            <text
              x="120"
              y="290"
              fill="#d0d7de"
              font-size="12"
            >
              PraveenNimilka
            </text>

            <text
              x="500"
              y="290"
              fill="#7d8590"
              font-size="11"
            >
              unknown
            </text>

            <text
              x="675"
              y="290"
              fill="#7d8590"
              font-size="11"
            >
              ★ 0
            </text>
            


    <!-- CURSOR -->

    <rect
      x="1010"
      y="421"
      width="8"
      height="14"
      fill="#39ff88"
    >

      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"
      />

    </rect>


    <text
      x="78"
      y="432"
      fill="#30363d"
      font-size="9"
      letter-spacing="1.4"
    >
      DATA // GITHUB API
    </text>

  </g>

</svg>