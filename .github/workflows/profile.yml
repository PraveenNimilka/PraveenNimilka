                y1="0"
                x2="1"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#090d12"
                />

                <stop
                  offset="100%"
                  stop-color="#0d1117"
                />

              </linearGradient>


              <linearGradient
                id="scanner"
                x1="0"
                x2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#39ff88"
                  stop-opacity="0"
                />

                <stop
                  offset="50%"
                  stop-color="#39ff88"
                  stop-opacity=".18"
                />

                <stop
                  offset="100%"
                  stop-color="#39ff88"
                  stop-opacity="0"
                />

              </linearGradient>


              <filter
                id="glow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
              >

                <feGaussianBlur
                  stdDeviation="3"
                  result="blur"
                />

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>

              </filter>

            </defs>


            <rect
              x="1"
              y="1"
              width="1098"
              height="388"
              rx="16"
              fill="url(#bg)"
              stroke="#30363d"
              stroke-width="2"
            />


            <g
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            >


              <!-- HEADER -->

              <circle
                cx="74"
                cy="54"
                r="5"
                fill="#39ff88"
                filter="url(#glow)"
              >

                <animate
                  attributeName="opacity"
                  values="1;.2;1"
                  dur="1.5s"
                  repeatCount="indefinite"
                />

              </circle>


              <text
                x="94"
                y="59"
                fill="#39ff88"
                font-size="12"
                letter-spacing="2"
              >
                CONTRIBUTION ENGINE // LIVE
              </text>


              <text
                x="1026"
                y="59"
                text-anchor="end"
                fill="#484f58"
                font-size="9"
              >
                PRAVEEN.OS
              </text>


              <!-- COMMAND -->

              <text
                x="74"
                y="96"
                fill="#39ff88"
                font-size="11"
              >
                praveen@github
              </text>


              <text
                x="190"
                y="96"
                fill="#7d8590"
                font-size="11"
              >
                :~$
              </text>


              <text
                x="221"
                y="96"
                fill="#d0d7de"
                font-size="11"
              >
                ./contributions --scan
              </text>


              <text
