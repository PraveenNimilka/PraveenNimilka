name: PRAVEEN.OS Profile Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */12 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: praveen-os-profile
  cancel-in-progress: true


jobs:

  build-profile:

    name: Build PRAVEEN.OS
    runs-on: ubuntu-latest
    timeout-minutes: 10


    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # PREPARE
      # ==========================================================

      - name: Prepare asset directory
        run: |
          mkdir -p assets


      # ==========================================================
      # GENERATE GITHUB SIGNAL
      # ==========================================================

      - name: Generate GitHub Signal
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}

        run: |
          python3 <<'PYTHON'

          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          from html import escape
          from datetime import datetime, timezone


          # ======================================================
          # CONFIG
          # ======================================================

          OWNER = os.environ["OWNER"]
          TOKEN = os.environ["GH_TOKEN"]

          API = "https://api.github.com"


          # ======================================================
          # REST API
          # ======================================================

          def github_api(path):

              request = urllib.request.Request(
                  API + path,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "praveen-os-profile"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as error:

                  print(
                      f"REST API HTTP error {error.code}: {path}"
                  )

                  return None

              except Exception as error:

                  print(
                      f"REST API error for {path}: {error}"
                  )

                  return None


          # ======================================================
          # USER
          # ======================================================

          user = github_api(
              f"/users/{urllib.parse.quote(OWNER)}"
          ) or {}


          followers = int(
              user.get("followers") or 0
          )


          # ======================================================
          # FETCH ALL PUBLIC OWNER REPOSITORIES
          # ======================================================

          repositories = []

          page = 1


          while True:

              result = github_api(
                  f"/users/{urllib.parse.quote(OWNER)}/repos"
                  f"?type=owner"
                  f"&sort=updated"
                  f"&direction=desc"
                  f"&per_page=100"
                  f"&page={page}"
              )

              if not isinstance(result, list):
                  break

              repositories.extend(result)

              if len(result) < 100:
                  break

              page += 1


          # ======================================================
          # FILTER REPOSITORIES
          # ======================================================

          original_repositories = [

              repo

              for repo in repositories

              if not repo.get("fork", False)

          ]


          public_repo_count = len(
              original_repositories
          )


          # Remove the profile repository from recent projects.

          project_repositories = [

              repo

              for repo in original_repositories

              if repo.get(
                  "name",
                  ""
              ).lower() != OWNER.lower()

          ]


          # ======================================================
          # STATS
          # ======================================================

          total_stars = sum(

              int(
                  repo.get(
                      "stargazers_count"
                  ) or 0
              )

              for repo
              in original_repositories

          )


          total_forks = sum(

              int(
                  repo.get(
                      "forks_count"
                  ) or 0
              )

              for repo
              in original_repositories

          )


          # ======================================================
          # LANGUAGES
          # ======================================================

          language_counts = {}


          for repo in project_repositories:

              language = repo.get(
                  "language"
              )

              if not language:
                  continue

              language_counts[language] = (
                  language_counts.get(
                      language,
                      0
                  )
                  + 1
              )


          top_languages = sorted(

              language_counts.items(),

              key=lambda pair: (
                  -pair[1],
                  pair[0]
              )

          )[:4]


          if top_languages:

              language_line = "  /  ".join(

                  language.upper()

                  for language, _
                  in top_languages

              )

          else:

              language_line = (
                  "AI  /  SOFTWARE  /  SYSTEMS  /  EXPERIMENTS"
              )


          # ======================================================
          # RECENT PUBLIC PROJECTS
          # ======================================================

          recent_projects = project_repositories[:4]


          # ======================================================
          # HELPERS
          # ======================================================

          def safe(value):

              return escape(
                  str(value),
                  quote=True
              )


          def trim(
              value,
              maximum=30
          ):

              value = str(value)

              if len(value) <= maximum:
                  return value

              return (
                  value[:maximum - 1]
                  + "…"
              )


          # ======================================================
          # PROJECT ROWS
          # ======================================================

          project_rows = []

          row_positions = [
              306,
              342,
              378,
              414
          ]


          if recent_projects:

              for index, repo in enumerate(
                  recent_projects
              ):

                  y = row_positions[index]


                  repo_name = safe(
                      trim(
                          repo.get(
                              "name",
                              "repository"
                          ),
                          30
                      )
                  )


                  language = safe(
                      trim(
                          repo.get(
                              "language"
                          )
                          or "unknown",
                          14
                      )
                  )


                  repo_stars = int(
                      repo.get(
                          "stargazers_count"
                      )
                      or 0
                  )


                  project_rows.append(
                      f'''
                      <g>

                        <text
                          x="82"
                          y="{y}"
                          fill="#39ff88"
                          font-size="11"
                        >
                          {index + 1:02d}
                        </text>

                        <text
                          x="125"
                          y="{y}"
                          fill="#d0d7de"
                          font-size="12"
                        >
                          {repo_name}
                        </text>

                        <text
                          x="515"
                          y="{y}"
                          fill="#7d8590"
                          font-size="11"
                        >
                          {language}
                        </text>

                        <text
                          x="690"
                          y="{y}"
                          fill="#7d8590"
                          font-size="11"
                        >
                          ★ {repo_stars}
                        </text>

                      </g>
                      '''
                  )


          else:

              project_rows.append(
                  '''
                  <text
                    x="82"
                    y="320"
                    fill="#7d8590"
                    font-size="12"
                  >
                    No public project repositories detected.
                  </text>

                  <text
                    x="82"
                    y="346"
                    fill="#484f58"
                    font-size="10"
                  >
                    Profile repository excluded from project list.
                  </text>
                  '''
              )


          recent_markup = "\n".join(
              project_rows
          )


          sync_time = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d %H:%M UTC"
          )


          # ======================================================
          # GITHUB SIGNAL SVG
          # ======================================================

          signal_svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="1100"
            height="475"
            viewBox="0 0 1100 475"
            role="img"
            aria-labelledby="signal-title signal-desc"
          >

            <title id="signal-title">
              PRAVEEN.OS GitHub Signal
            </title>

            <desc id="signal-desc">
              Live public GitHub statistics for Praveen Nimilka.
            </desc>


            <defs>

              <linearGradient
                id="signal-background"
                x1="0"
                y1="0"
                x2="1"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#090d12"
                />

                <stop
                  offset="100%"
                  stop-color="#0d1117"
                />

              </linearGradient>


              <linearGradient
                id="moving-signal"
                x1="0"
                x2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#39ff88"
                  stop-opacity="0"
                />

                <stop
                  offset="50%"
                  stop-color="#39ff88"
                  stop-opacity=".9"
                />

                <stop
                  offset="100%"
                  stop-color="#39ff88"
                  stop-opacity="0"
                />

              </linearGradient>


              <filter
                id="signal-glow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
              >

                <feGaussianBlur
                  stdDeviation="4"
                  result="blur"
                />

                <feMerge>

                  <feMergeNode
                    in="blur"
                  />

                  <feMergeNode
                    in="SourceGraphic"
                  />

                </feMerge>

              </filter>

            </defs>


            <rect
              x="1"
              y="1"
              width="1098"
              height="473"
              rx="16"
              fill="url(#signal-background)"
              stroke="#30363d"
              stroke-width="2"
            />


            <rect
              x="-300"
              y="1"
              width="300"
              height="2"
              fill="url(#moving-signal)"
            >

              <animate
                attributeName="x"
                from="-300"
                to="1100"
                dur="5s"
                repeatCount="indefinite"
              />

            </rect>


            <g
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            >


              <circle
                cx="80"
                cy="58"
                r="5"
                fill="#39ff88"
                filter="url(#signal-glow)"
              >

                <animate
                  attributeName="opacity"
                  values="1;.2;1"
                  dur="1.7s"
                  repeatCount="indefinite"
                />

              </circle>


              <text
                x="99"
                y="63"
                fill="#39ff88"
                font-size="12"
                letter-spacing="2"
              >
                GITHUB SIGNAL // LIVE
              </text>


              <text
                x="1018"
                y="62"
                text-anchor="end"
                fill="#484f58"
                font-size="9"
                letter-spacing="1"
              >
                PRAVEEN.OS
              </text>


              <text
                x="80"
                y="108"
                fill="#39ff88"
                font-size="12"
              >
                praveen@github
              </text>


              <text
                x="202"
                y="108"
                fill="#7d8590"
                font-size="12"
              >
                :~$
              </text>


              <text
                x="236"
                y="108"
                fill="#d0d7de"
                font-size="12"
              >
                ./signal --live
              </text>


              <text
                x="1018"
                y="108"
                text-anchor="end"
                fill="#30363d"
                font-size="9"
              >
                {safe(sync_time)}
              </text>


              <line
                x1="80"
                y1="132"
                x2="1018"
                y2="132"
                stroke="#21262d"
              />


              <text
                x="80"
                y="176"
                fill="#7d8590"
                font-size="9"
                letter-spacing="1.6"
              >
                PUBLIC REPOS
              </text>


              <text
                x="330"
                y="176"
                fill="#7d8590"
                font-size="9"
                letter-spacing="1.6"
              >
                TOTAL STARS
              </text>


              <text
                x="570"
                y="176"
                fill="#7d8590"
                font-size="9"
                letter-spacing="1.6"
              >
                FOLLOWERS
              </text>


              <text
                x="810"
                y="176"
                fill="#7d8590"
                font-size="9"
                letter-spacing="1.6"
              >
                SYSTEM
              </text>


              <text
                x="80"
                y="218"
                fill="#f0f6fc"
                font-size="30"
                font-weight="700"
              >
                {public_repo_count}
              </text>


              <text
                x="330"
                y="218"
                fill="#f0f6fc"
                font-size="30"
                font-weight="700"
              >
                {total_stars}
              </text>


              <text
                x="570"
                y="218"
                fill="#f0f6fc"
                font-size="30"
                font-weight="700"
              >
                {followers}
              </text>


              <text
                x="810"
                y="218"
                fill="#39ff88"
                font-size="28"
                font-weight="700"
              >
                ONLINE
              </text>


              <text
                x="80"
                y="252"
                fill="#484f58"
                font-size="9"
                letter-spacing="1.4"
              >
                {safe(language_line)}
              </text>


              <text
                x="1018"
                y="252"
                fill="#484f58"
                text-anchor="end"
                font-size="9"
              >
                FORKS // {total_forks}
              </text>


              <line
                x1="80"
                y1="268"
                x2="1018"
                y2="268"
                stroke="#21262d"
              />


              <text
                x="80"
                y="289"
                fill="#484f58"
                font-size="9"
                letter-spacing="1.6"
              >
                RECENT PUBLIC PROJECTS
              </text>


              {recent_markup}


              <text
                x="80"
                y="447"
                fill="#30363d"
                font-size="9"
                letter-spacing="1.4"
              >
                DATA // GITHUB PUBLIC API
              </text>


              <text
                x="1018"
                y="447"
                fill="#30363d"
                text-anchor="end"
                font-size="9"
                letter-spacing="1"
              >
                PRIVATE DATA // NOT EXPOSED
              </text>


              <rect
                x="1012"
                y="417"
                width="7"
                height="14"
                fill="#39ff88"
              >

                <animate
                  attributeName="opacity"
                  values="1;0;1"
                  dur="1s"
                  repeatCount="indefinite"
                />

              </rect>

            </g>

          </svg>'''


          os.makedirs(
              "assets",
              exist_ok=True
          )


          with open(
              "assets/github-signal.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  signal_svg
              )


          print("")
          print("GitHub Signal generated.")
          print(f"Public repos : {public_repo_count}")
          print(f"Stars        : {total_stars}")
          print(f"Followers    : {followers}")
          print(f"Projects     : {len(project_repositories)}")
          print("")

          PYTHON


      # ==========================================================
      # GENERATE CONTRIBUTION ENGINE
      # ==========================================================

      - name: Generate Contribution Engine
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}

        run: |
          python3 <<'PYTHON'

          import os
          import json
          import urllib.request

          from datetime import datetime


          TOKEN = os.environ["GH_TOKEN"]
          OWNER = os.environ["OWNER"]


          # ======================================================
          # GRAPHQL
          # ======================================================

          query = """
          query($login: String!) {

            user(login: $login) {

              contributionsCollection {

                contributionCalendar {

                  totalContributions

                  weeks {

                    contributionDays {

                      contributionCount
                      contributionLevel
                      date
                      weekday

                    }

                  }

                }

              }

            }

          }
          """


          payload = json.dumps({

              "query": query,

              "variables": {
                  "login": OWNER
              }

          }).encode(
              "utf-8"
          )


          request = urllib.request.Request(

              "https://api.github.com/graphql",

              data=payload,

              headers={

                  "Authorization":
                      f"Bearer {TOKEN}",

                  "Content-Type":
                      "application/json",

                  "Accept":
                      "application/vnd.github+json",

                  "User-Agent":
                      "praveen-os-profile"

              }

          )


          try:

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  result = json.loads(
                      response.read().decode(
                          "utf-8"
                      )
                  )

          except Exception as error:

              raise RuntimeError(
                  f"GraphQL request failed: {error}"
              )


          if result.get("errors"):

              raise RuntimeError(
                  json.dumps(
                      result["errors"],
                      indent=2
                  )
              )


          user = (
              result
              .get("data", {})
              .get("user")
          )


          if not user:

              raise RuntimeError(
                  f"GitHub user not found: {OWNER}"
              )


          calendar = (
              user
              ["contributionsCollection"]
              ["contributionCalendar"]
          )


          weeks = calendar[
              "weeks"
          ]


          total_contributions = calendar[
              "totalContributions"
          ]


          # ======================================================
          # GRID CONFIG
          # ======================================================

          CELL = 13
          GAP = 5

          STEP = CELL + GAP

          START_X = 74
          START_Y = 164

          DISPLAY_WEEKS = 53


          displayed_weeks = weeks[
              -DISPLAY_WEEKS:
          ]


          # ======================================================
          # COLORS
          # ======================================================

          colors = {

              "NONE":
                  "#111820",

              "FIRST_QUARTILE":
                  "#123524",

              "SECOND_QUARTILE":
                  "#176b3a",

              "THIRD_QUARTILE":
                  "#26a65b",

              "FOURTH_QUARTILE":
                  "#39ff88"

          }


          # ======================================================
          # CONTRIBUTION CELLS
          # ======================================================

          cell_markup = []


          for week_index, week in enumerate(
              displayed_weeks
          ):

              contribution_days = week.get(
                  "contributionDays",
                  []
              )


              for day in contribution_days:

                  weekday = int(
                      day.get(
                          "weekday",
                          0
                      )
                  )


                  x = (
                      START_X
                      + week_index * STEP
                  )


                  y = (
                      START_Y
                      + weekday * STEP
                  )


                  level = day.get(
                      "contributionLevel",
                      "NONE"
                  )


                  color = colors.get(
                      level,
                      "#111820"
                  )


                  count = int(
                      day.get(
                          "contributionCount",
                          0
                      )
                  )


                  date = day.get(
                      "date",
                      ""
                  )


                  cell_markup.append(
                      f'''
                      <g>

                        <title>
                          {date}: {count} contributions
                        </title>

                        <rect
                          x="{x}"
                          y="{y}"
                          width="{CELL}"
                          height="{CELL}"
                          rx="3"
                          fill="{color}"
                        />

                      </g>
                      '''
                  )


          grid_markup = "\n".join(
              cell_markup
          )


          # ======================================================
          # MONTH LABELS
          # ======================================================

          month_markup = []

          previous_month = None


          for week_index, week in enumerate(
              displayed_weeks
          ):

              days = week.get(
                  "contributionDays",
                  []
              )

              if not days:
                  continue


              try:

                  first_date = datetime.strptime(
                      days[0]["date"],
                      "%Y-%m-%d"
                  )

              except Exception:
                  continue


              current_month = (
                  first_date.year,
                  first_date.month
              )


              if current_month == previous_month:
                  continue


              previous_month = current_month


              x = (
                  START_X
                  + week_index * STEP
              )


              month_markup.append(
                  f'''
                  <text
                    x="{x}"
                    y="145"
                    fill="#484f58"
                    font-size="9"
                  >
                    {first_date.strftime("%b")}
                  </text>
                  '''
              )


          months_markup = "\n".join(
              month_markup
          )


          grid_width = max(
              len(displayed_weeks),
              1
          ) * STEP


          # ======================================================
          # CONTRIBUTION SVG
          # ======================================================

          contribution_svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="1100"
            height="390"
            viewBox="0 0 1100 390"
            role="img"
            aria-labelledby="contribution-title contribution-desc"
          >

            <title id="contribution-title">
              PRAVEEN.OS Contribution Engine
            </title>

            <desc id="contribution-desc">
              Animated GitHub contribution activity matrix.
            </desc>


            <defs>

              <linearGradient
                id="contribution-background"
                x1="0"
                y1="0"
                x2="1"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#090d12"
                />

                <stop
                  offset="100%"
                  stop-color="#0d1117"
                />

              </linearGradient>


              <linearGradient
                id="scanner-gradient"
                x1="0"
                x2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#39ff88"
                  stop-opacity="0"
                />

                <stop
                  offset="50%"
                  stop-color="#39ff88"
                  stop-opacity=".18"
                />

                <stop
                  offset="100%"
                  stop-color="#39ff88"
                  stop-opacity="0"
                />

              </linearGradient>


              <filter
                id="contribution-glow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
              >

                <feGaussianBlur
                  stdDeviation="3"
                  result="blur"
                />

                <feMerge>

                  <feMergeNode
                    in="blur"
                  />

                  <feMergeNode
                    in="SourceGraphic"
                  />

                </feMerge>

              </filter>

            </defs>


            <rect
              x="1"
              y="1"
              width="1098"
              height="388"
              rx="16"
              fill="url(#contribution-background)"
              stroke="#30363d"
              stroke-width="2"
            />


            <g
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            >


              <circle
                cx="74"
                cy="58"
                r="5"
                fill="#39ff88"
                filter="url(#contribution-glow)"
              >

                <animate
                  attributeName="opacity"
                  values="1;.2;1"
                  dur="1.6s"
                  repeatCount="indefinite"
                />

              </circle>


              <text
                x="93"
                y="63"
                fill="#39ff88"
                font-size="12"
                letter-spacing="2"
              >
                CONTRIBUTION ENGINE // LIVE
              </text>


              <text
                x="1026"
                y="63"
                text-anchor="end"
                fill="#484f58"
                font-size="9"
                letter-spacing="1"
              >
                PRAVEEN.OS
              </text>


              <text
                x="74"
                y="105"
                fill="#39ff88"
                font-size="11"
              >
                praveen@github
              </text>


              <text
                x="190"
                y="105"
                fill="#7d8590"
                font-size="11"
              >
                :~$
              </text>


              <text
                x="220"
                y="105"
                fill="#d0d7de"
                font-size="11"
              >
                ./contributions --scan
              </text>


              <text
                x="1026"
                y="105"
                text-anchor="end"
                fill="#39ff88"
                font-size="11"
              >
                {total_contributions} EVENTS
              </text>


              <line
                x1="74"
                y1="121"
                x2="1026"
                y2="121"
                stroke="#21262d"
              />


              {months_markup}


              {grid_markup}


              <!-- animated scanning field -->

              <rect
                x="{START_X - 18}"
                y="{START_Y - 7}"
                width="42"
                height="139"
                fill="url(#scanner-gradient)"
              >

                <animate
                  attributeName="x"
                  from="{START_X - 18}"
                  to="{START_X + grid_width}"
                  dur="7s"
                  repeatCount="indefinite"
                />

              </rect>


              <!-- animated scanner beam -->

              <rect
                x="{START_X - 4}"
                y="{START_Y - 7}"
                width="2"
