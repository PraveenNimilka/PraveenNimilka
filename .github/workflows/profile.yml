      # ==========================================================
      # 6. SAFE COMMIT / PUSH
      # ==========================================================

      - name: Commit profile assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Preserving generated assets..."

          mkdir -p /tmp/praveen-profile-assets

          cp \
            assets/github-signal.svg \
            /tmp/praveen-profile-assets/github-signal.svg

          cp \
            assets/contribution-engine.svg \
            /tmp/praveen-profile-assets/contribution-engine.svg


          git config \
            user.name \
            "praveen-os[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          echo "Fetching latest main..."

          git fetch origin main


          echo "Resetting to latest origin/main..."

          git reset \
            --hard \
            origin/main


          mkdir -p assets


          echo "Restoring generated files..."

          cp \
            /tmp/praveen-profile-assets/github-signal.svg \
            assets/github-signal.svg

          cp \
            /tmp/praveen-profile-assets/contribution-engine.svg \
            assets/contribution-engine.svg


          git add \
            assets/github-signal.svg \
            assets/contribution-engine.svg


          if git diff --cached --quiet; then

            echo "✓ Assets already current."
            exit 0

          fi


          git commit \
            -m "chore: refresh PRAVEEN.OS telemetry [skip ci]"


          # Retry once if main changed while we were generating.
          if ! git push origin HEAD:main; then

            echo "Remote changed during generation. Retrying safely..."

            cp \
              assets/github-signal.svg \
              /tmp/praveen-profile-assets/github-signal.svg

            cp \
              assets/contribution-engine.svg \
              /tmp/praveen-profile-assets/contribution-engine.svg


            git fetch origin main

            git reset \
              --hard \
              origin/main


            mkdir -p assets


            cp \
              /tmp/praveen-profile-assets/github-signal.svg \
              assets/github-signal.svg

            cp \
              /tmp/praveen-profile-assets/contribution-engine.svg \
              assets/contribution-engine.svg


            git add \
              assets/github-signal.svg \
              assets/contribution-engine.svg


            if git diff --cached --quiet; then

              echo "✓ Remote already contains latest assets."
              exit 0

            fi


            git commit \
              -m "chore: refresh PRAVEEN.OS telemetry [skip ci]"


            git push \
              origin \
              HEAD:main

          fi


