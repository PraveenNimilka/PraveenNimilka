name: PRAVEEN.OS Profile Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */12 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: praveen-os-profile
  cancel-in-progress: true


jobs:
  build-profile:

    name: Build PRAVEEN.OS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      # ==========================================================
      # PREPARE
      # ==========================================================

      - name: Prepare assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets


      # ==========================================================
      # GENERATE GITHUB SIGNAL
      # ==========================================================

      - name: Generate GitHub Signal
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}

        run: |
          python3 <<'PYTHON'

          import os
          import json
          import urllib.request
          import urllib.parse
          from html import escape
          from datetime import datetime, timezone


          OWNER = os.environ["OWNER"]
          TOKEN = os.environ["GH_TOKEN"]

          API = "https://api.github.com"


          # ======================================================
          # API HELPER
          # ======================================================

          def api(path):

              request = urllib.request.Request(
                  API + path,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "praveen-os-profile"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  return json.loads(
                      response.read().decode("utf-8")
                  )


          # ======================================================
          # USER
          # ======================================================

          try:

              user = api(
                  f"/users/{urllib.parse.quote(OWNER)}"
              )

          except Exception as error:

              print(
                  f"User API warning: {error}"
              )

              user = {}


          followers = int(
              user.get("followers") or 0
          )


          # ======================================================
          # PUBLIC REPOSITORIES
          # ======================================================

          repositories = []

          page = 1

          while True:

              try:

                  result = api(
                      f"/users/{urllib.parse.quote(OWNER)}/repos"
                      f"?type=owner"
                      f"&sort=updated"
                      f"&direction=desc"
                      f"&per_page=100"
                      f"&page={page}"
                  )

              except Exception as error:

                  print(
                      f"Repository API warning: {error}"
                  )

                  break


              if not isinstance(
                  result,
                  list
              ):
                  break


              repositories.extend(
                  result
              )


              if len(result) < 100:
                  break


              page += 1


          original_repositories = [
              repo
              for repo in repositories
              if not repo.get("fork", False)
          ]


          public_repo_count = len(
              original_repositories
          )


          # Remove profile repository from project list

          projects = [
              repo
              for repo in original_repositories
              if repo.get(
                  "name",
                  ""
              ).lower() != OWNER.lower()
          ]


          # ======================================================
          # TOTALS
          # ======================================================

          total_stars = sum(
              int(
                  repo.get(
                      "stargazers_count"
                  ) or 0
              )
              for repo in original_repositories
          )


          total_forks = sum(
              int(
                  repo.get(
                      "forks_count"
                  ) or 0
              )
              for repo in original_repositories
          )


          # ======================================================
          # LANGUAGES
          # ======================================================

          language_counts = {}


          for repo in projects:

              language = repo.get(
                  "language"
              )

              if not language:
                  continue


              language_counts[
                  language
              ] = (
                  language_counts.get(
                      language,
                      0
                  )
                  + 1
              )


          top_languages = sorted(
              language_counts.items(),
              key=lambda item: (
                  -item[1],
                  item[0]
              )
          )[:4]


          if top_languages:

              language_line = "  /  ".join(
                  language.upper()
                  for language, _
                  in top_languages
              )

          else:

              language_line = (
                  "AI  /  SOFTWARE  /  SYSTEMS  /  EXPERIMENTS"
              )


          # ======================================================
          # HELPERS
          # ======================================================

          def safe(value):

              return escape(
                  str(value),
                  quote=True
              )


          def trim(
              value,
              maximum=28
          ):

              value = str(value)

              if len(value) <= maximum:
                  return value

              return (
                  value[:maximum - 1]
                  + "…"
              )


          # ======================================================
          # RECENT PROJECTS
          # ======================================================

          recent = projects[:4]

          rows = []

          row_y = [
              307,
              343,
              379,
              415
          ]


          if recent:

              for index, repo in enumerate(
                  recent
              ):

                  y = row_y[
                      index
                  ]


                  name = safe(
                      trim(
                          repo.get(
                              "name",
                              "repository"
                          ),
                          30
                      )
                  )


                  language = safe(
                      trim(
                          repo.get(
                              "language"
                          )
                          or "unknown",
                          15
                      )
                  )


                  stars = int(
                      repo.get(
                          "stargazers_count"
                      )
                      or 0
                  )


                  rows.append(
                      f'''
                      <g>

                        <text
                          x="82"
                          y="{y}"
                          fill="#39ff88"
                          font-size="11"
                        >
                          {index + 1:02d}
                        </text>

                        <text
                          x="126"
                          y="{y}"
                          fill="#d0d7de"
                          font-size="12"
                        >
                          {name}
                        </text>

                        <text
                          x="505"
                          y="{y}"
                          fill="#7d8590"
                          font-size="11"
                        >
                          {language}
                        </text>

                        <text
                          x="680"
                          y="{y}"
                          fill="#7d8590"
                          font-size="11"
                        >
                          ★ {stars}
                        </text>

                      </g>
                      '''
                  )


          else:

              rows.append(
                  '''
                  <text
                    x="82"
                    y="327"
                    fill="#7d8590"
                    font-size="12"
                  >
                    No public project repositories detected.
                  </text>

                  <text
                    x="82"
                    y="353"
                    fill="#484f58"
                    font-size="10"
                  >
                    Profile repository excluded from project list.
                  </text>
                  '''
              )


          row_markup = "\n".join(
              rows
          )


          sync_time = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d %H:%M UTC"
          )


          # ======================================================
          # SIGNAL SVG
          # ======================================================

          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="1100"
            height="475"
            viewBox="0 0 1100 475"
            role="img"
          >

            <defs>

              <linearGradient
                id="bg"
                x1="0"
                y1="0"
                x2="1"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#090d12"
                />

                <stop
                  offset="100%"
                  stop-color="#0d1117"
                />

              </linearGradient>


              <linearGradient
                id="beam"
                x1="0"
                x2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#39ff88"
                  stop-opacity="0"
                />

                <stop
                  offset="50%"
                  stop-color="#39ff88"
                  stop-opacity=".9"
                />

                <stop
                  offset="100%"
                  stop-color="#39ff88"
                  stop-opacity="0"
                />

              </linearGradient>


              <filter
                id="glow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
              >

                <feGaussianBlur
                  stdDeviation="4"
                  result="blur"
                />

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>

              </filter>

            </defs>


            <rect
              x="1"
              y="1"
              width="1098"
              height="473"
              rx="16"
              fill="url(#bg)"
              stroke="#30363d"
              stroke-width="2"
            />


            <rect
              x="-280"
              y="1"
              width="280"
              height="2"
              fill="url(#beam)"
            >

              <animate
                attributeName="x"
                from="-280"
                to="1100"
                dur="5s"
                repeatCount="indefinite"
              />

            </rect>


            <g
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            >


              <circle
                cx="80"
                cy="58"
                r="5"
                fill="#39ff88"
                filter="url(#glow)"
              >

                <animate
                  attributeName="opacity"
                  values="1;.2;1"
                  dur="1.7s"
                  repeatCount="indefinite"
                />

              </circle>


              <text
                x="99"
                y="63"
                fill="#39ff88"
                font-size="12"
                letter-spacing="2"
              >
                GITHUB SIGNAL // LIVE
              </text>


              <text
                x="1018"
                y="62"
                text-anchor="end"
                fill="#484f58"
                font-size="9"
              >
                PRAVEEN.OS
              </text>


              <text
                x="80"
                y="108"
                fill="#39ff88"
                font-size="12"
              >
                praveen@github
              </text>


              <text
                x="202"
                y="108"
                fill="#7d8590"
                font-size="12"
              >
                :~$
              </text>


              <text
                x="236"
                y="108"
                fill="#d0d7de"
                font-size="12"
              >
                ./signal --live
              </text>


              <text
                x="1018"
                y="108"
                text-anchor="end"
                fill="#30363d"
                font-size="9"
              >
                {safe(sync_time)}
              </text>


              <line
                x1="80"
                y1="132"
                x2="1018"
                y2="132"
                stroke="#21262d"
              />


              <text
                x="80"
                y="176"
                fill="#7d8590"
                font-size="9"
                letter-spacing="1.5"
              >
                PUBLIC REPOS
              </text>


              <text
                x="330"
                y="176"
                fill="#7d8590"
                font-size="9"
                letter-spacing="1.5"
              >
                TOTAL STARS
              </text>


              <text
                x="570"
                y="176"
                fill="#7d8590"
                font-size="9"
                letter-spacing="1.5"
              >
                FOLLOWERS
              </text>


              <text
                x="810"
                y="176"
                fill="#7d8590"
                font-size="9"
                letter-spacing="1.5"
              >
                SYSTEM
              </text>


              <text
                x="80"
                y="218"
                fill="#f0f6fc"
                font-size="30"
                font-weight="700"
              >
                {public_repo_count}
              </text>


              <text
                x="330"
                y="218"
                fill="#f0f6fc"
                font-size="30"
                font-weight="700"
              >
                {total_stars}
              </text>


              <text
                x="570"
                y="218"
                fill="#f0f6fc"
                font-size="30"
                font-weight="700"
              >
                {followers}
              </text>


              <text
                x="810"
                y="218"
                fill="#39ff88"
                font-size="28"
                font-weight="700"
              >
                ONLINE
              </text>


              <text
                x="80"
                y="252"
                fill="#484f58"
                font-size="9"
                letter-spacing="1.3"
              >
                {safe(language_line)}
              </text>


              <text
                x="1018"
                y="252"
                fill="#484f58"
                text-anchor="end"
                font-size="9"
              >
                FORKS // {total_forks}
              </text>


              <line
                x1="80"
                y1="268"
                x2="1018"
                y2="268"
                stroke="#21262d"
              />


              <text
                x="80"
                y="289"
                fill="#484f58"
                font-size="9"
                letter-spacing="1.5"
              >
                RECENT PUBLIC PROJECTS
              </text>


              {row_markup}


              <text
                x="80"
                y="447"
                fill="#30363d"
                font-size="9"
              >
                DATA // GITHUB PUBLIC API
              </text>


              <text
                x="1018"
                y="447"
                fill="#30363d"
                text-anchor="end"
                font-size="9"
              >
                PRIVATE DATA // NOT EXPOSED
              </text>


              <rect
                x="1012"
                y="417"
                width="7"
                height="14"
                fill="#39ff88"
              >

                <animate
                  attributeName="opacity"
                  values="1;0;1"
                  dur="1s"
                  repeatCount="indefinite"
                />

              </rect>

            </g>

          </svg>'''


          os.makedirs(
              "assets",
              exist_ok=True
          )


          with open(
              "assets/github-signal.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(svg)


          print(
              "✓ GitHub signal generated"
          )

          PYTHON


      # ==========================================================
      # GENERATE CONTRIBUTION ENGINE
      # ==========================================================

      - name: Generate Contribution Engine
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}

        run: |
          python3 <<'PYTHON'

          import os
          import json
          import urllib.request
          from datetime import datetime


          TOKEN = os.environ["GH_TOKEN"]
          OWNER = os.environ["OWNER"]


          # ======================================================
          # GRAPHQL QUERY
          # ======================================================

          query = """
          query($login: String!) {

            user(login: $login) {

              contributionsCollection {

                contributionCalendar {

                  totalContributions

                  weeks {

                    firstDay

                    contributionDays {

                      contributionCount
                      contributionLevel
                      date
                      weekday

                    }

                  }

                }

              }

            }

          }
          """


          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": OWNER
              }
          }).encode(
              "utf-8"
          )


          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "praveen-os-profile"
              }
          )


          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:

              result = json.loads(
                  response.read().decode("utf-8")
              )


          if result.get("errors"):

              raise RuntimeError(
                  json.dumps(
                      result["errors"],
                      indent=2
                  )
              )


          user = (
              result
              .get("data", {})
              .get("user")
          )


          if not user:

              raise RuntimeError(
                  f"User not found: {OWNER}"
              )


          calendar = (
              user
              ["contributionsCollection"]
              ["contributionCalendar"]
          )


          total = int(
              calendar[
                  "totalContributions"
              ]
          )


          weeks = calendar[
              "weeks"
          ][-53:]


          # ======================================================
          # GRID
          # ======================================================

          WIDTH = 1100
          HEIGHT = 390

          CELL = 13
          GAP = 4

          STEP = (
              CELL
              + GAP
          )

          GRID_X = 126
          GRID_Y = 154


          colors = {
              "NONE": "#161b22",
              "FIRST_QUARTILE": "#0e4429",
              "SECOND_QUARTILE": "#006d32",
              "THIRD_QUARTILE": "#26a641",
              "FOURTH_QUARTILE": "#39ff88"
          }


          borders = {
              "NONE": "#30363d",
              "FIRST_QUARTILE": "#155f3c",
              "SECOND_QUARTILE": "#128a47",
              "THIRD_QUARTILE": "#38c765",
              "FOURTH_QUARTILE": "#69ffaa"
          }


          # ======================================================
          # CELLS
          # ======================================================

          cells = []


          for week_index, week in enumerate(
              weeks
          ):

              for day in week.get(
                  "contributionDays",
                  []
              ):

                  weekday = int(
                      day.get(
                          "weekday",
                          0
                      )
                  )


                  x = (
                      GRID_X
                      + week_index * STEP
                  )


                  y = (
                      GRID_Y
                      + weekday * STEP
                  )


                  level = day.get(
                      "contributionLevel",
                      "NONE"
                  )


                  fill = colors.get(
                      level,
                      colors["NONE"]
                  )


                  border = borders.get(
                      level,
                      borders["NONE"]
                  )


                  count = int(
                      day.get(
                          "contributionCount",
                          0
                      )
                  )


                  date = day.get(
                      "date",
                      ""
                  )


                  cells.append(
                      f'''
                      <g>

                        <title>
                          {date}: {count} contributions
                        </title>

                        <rect
                          x="{x}"
                          y="{y}"
                          width="{CELL}"
                          height="{CELL}"
                          rx="3"
                          fill="{fill}"
                          stroke="{border}"
                          stroke-width="1"
                        />

                      </g>
                      '''
                  )


          cells_markup = "\n".join(
              cells
          )


          # ======================================================
          # MONTH LABELS
          # ======================================================

          months = []

          last_month = None


          for index, week in enumerate(
              weeks
          ):

              first_day = week.get(
                  "firstDay"
              )


              if not first_day:
                  continue


              try:

                  date = datetime.strptime(
                      first_day,
                      "%Y-%m-%d"
                  )

              except Exception:

                  continue


              key = (
                  date.year,
                  date.month
              )


              if key == last_month:
                  continue


              last_month = key


              x = (
                  GRID_X
                  + index * STEP
              )


              months.append(
                  f'''
                  <text
                    x="{x}"
                    y="136"
                    fill="#7d8590"
                    font-size="9"
                  >
                    {date.strftime("%b")}
                  </text>
                  '''
              )


          months_markup = "\n".join(
              months
          )


          grid_width = max(
              len(weeks),
              1
          ) * STEP


          # ======================================================
          # SVG
          # ======================================================

          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="{WIDTH}"
            height="{HEIGHT}"
            viewBox="0 0 {WIDTH} {HEIGHT}"
