      # ==========================================================
      # VALIDATE GENERATED FILES
      # ==========================================================

      - name: Validate generated assets
        shell: bash
        run: |
          set -euo pipefail

          test -s assets/github-signal.svg
          test -s assets/contribution-engine.svg

          echo "Generated:"
          ls -lh \
            assets/github-signal.svg \
            assets/contribution-engine.svg


      # ==========================================================
      # SAFE COMMIT
      # ==========================================================

      - name: Commit generated profile assets
        shell: bash
        run: |
          set -euo pipefail


          # ------------------------------------------------------
          # Preserve generated files
          # ------------------------------------------------------

          TEMP_DIR="$(mktemp -d)"

          cp \
            assets/github-signal.svg \
            "$TEMP_DIR/github-signal.svg"

          cp \
            assets/contribution-engine.svg \
            "$TEMP_DIR/contribution-engine.svg"


          # ------------------------------------------------------
          # Configure Git
          # ------------------------------------------------------

          git config \
            user.name \
            "praveen-os[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # ------------------------------------------------------
          # Synchronise with newest remote main
          # ------------------------------------------------------

          git fetch \
            origin \
            main

          git reset \
            --hard \
            origin/main


          # ------------------------------------------------------
          # Restore generated assets
          # ------------------------------------------------------

          mkdir -p assets

          cp \
            "$TEMP_DIR/github-signal.svg" \
            assets/github-signal.svg

          cp \
            "$TEMP_DIR/contribution-engine.svg" \
            assets/contribution-engine.svg


          git add \
            assets/github-signal.svg \
            assets/contribution-engine.svg


          # ------------------------------------------------------
          # No changes
          # ------------------------------------------------------

          if git diff --cached --quiet; then

            echo "✓ Dynamic profile already current."
            exit 0

          fi


          # ------------------------------------------------------
          # Commit
          # ------------------------------------------------------

          git commit \
            -m "chore: refresh PRAVEEN.OS telemetry [skip ci]"


          # ------------------------------------------------------
          # Push with safe retry
          # ------------------------------------------------------

          if git push origin HEAD:main; then

            echo "✓ Profile updated."
            exit 0

          fi


          echo "Remote changed. Retrying..."


          # Save generated files again

          cp \
            assets/github-signal.svg \
            "$TEMP_DIR/github-signal.svg"

          cp \
            assets/contribution-engine.svg \
            "$TEMP_DIR/contribution-engine.svg"


          git fetch \
            origin \
            main


          git reset \
            --hard \
            origin/main


          mkdir -p assets


          cp \
            "$TEMP_DIR/github-signal.svg" \
            assets/github-signal.svg

          cp \
            "$TEMP_DIR/contribution-engine.svg" \
            assets/contribution-engine.svg


          git add \
            assets/github-signal.svg \
            assets/contribution-engine.svg


          if git diff --cached --quiet; then

            echo "✓ Remote already contains generated assets."
            exit 0

          fi


          git commit \
            -m "chore: refresh PRAVEEN.OS telemetry [skip ci]"


          git push \
            origin \
            HEAD:main


          echo "✓ Retry successful."
