name: PRAVEEN.OS Profile Engine

on:
  workflow_dispatch:

  schedule:
    # Refresh every 12 hours
    - cron: "17 */12 * * *"

permissions:
  contents: write

concurrency:
  group: praveen-os-profile
  cancel-in-progress: true

jobs:
  build-profile:
    name: Build PRAVEEN.OS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create directories
        run: |
          mkdir -p assets
          mkdir -p dist


      # ==========================================================
      # 2. GENERATE LIVE GITHUB SIGNAL
      # ==========================================================

      - name: Generate GitHub signal
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}

        run: |
          python3 <<'PYTHON'

          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error
          from html import escape
          from datetime import datetime, timezone


          # ======================================================
          # CONFIG
          # ======================================================

          OWNER = os.environ["OWNER"]
          TOKEN = os.environ["GH_TOKEN"]

          API = "https://api.github.com"


          # ======================================================
          # GITHUB API
          # ======================================================

          def github_api(path):

              request = urllib.request.Request(
                  API + path,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "praveen-os-profile"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:

                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as error:

                  print(
                      f"GitHub API HTTP error "
                      f"{error.code}: {path}"
                  )

                  return None

              except Exception as error:

                  print(
                      f"GitHub API error: "
                      f"{path}: {error}"
                  )

                  return None


          # ======================================================
          # USER PROFILE
          # ======================================================

          user = github_api(
              f"/users/{urllib.parse.quote(OWNER)}"
          ) or {}


          followers = int(
              user.get("followers") or 0
          )


          # ======================================================
          # FETCH ALL PUBLIC REPOSITORIES
          # ======================================================

          repositories = []

          page = 1

          while True:

              result = github_api(
                  f"/users/{urllib.parse.quote(OWNER)}/repos"
                  f"?type=owner"
                  f"&sort=updated"
                  f"&direction=desc"
                  f"&per_page=100"
                  f"&page={page}"
              )

              if not isinstance(result, list):
                  break

              repositories.extend(result)

              if len(result) < 100:
                  break

              page += 1


          # ======================================================
          # FILTER
          # ======================================================

          # Public, non-fork repositories.
          original_repos = [
              repo
              for repo in repositories
              if not repo.get("fork", False)
          ]


          public_repo_count = len(
              original_repos
          )


          # Do not show the profile repository as a project
          project_repos = [
              repo
              for repo in original_repos
              if repo.get("name", "").lower()
              != OWNER.lower()
          ]


          # ======================================================
          # STATS
          # ======================================================

          total_stars = sum(
              int(repo.get("stargazers_count") or 0)
              for repo in original_repos
          )


          total_forks = sum(
              int(repo.get("forks_count") or 0)
              for repo in original_repos
          )


          # ======================================================
          # LANGUAGES
          # ======================================================

          language_counts = {}

          for repo in project_repos:

              language = repo.get("language")

              if not language:
                  continue

              language_counts[language] = (
                  language_counts.get(language, 0) + 1
              )


          top_languages = sorted(
              language_counts.items(),
              key=lambda pair: (-pair[1], pair[0])
          )[:4]


          if top_languages:

              language_line = "  /  ".join(
                  language.upper()
                  for language, _
                  in top_languages
              )

          else:

              language_line = (
                  "AI  /  SOFTWARE  /  SYSTEMS"
              )


          # ======================================================
          # RECENT PROJECTS
          # ======================================================

          recent = project_repos[:4]


          # ======================================================
          # HELPERS
          # ======================================================

          def safe(value):

              return escape(
                  str(value),
                  quote=True
              )


          def trim(value, maximum=30):

              value = str(value)

              if len(value) <= maximum:
                  return value

              return (
                  value[:maximum - 1]
                  + "…"
              )


          # ======================================================
          # PROJECT ROWS
          # ======================================================

          rows = []

          y_positions = [
              306,
              342,
              378,
              414
          ]


          if recent:

              for index, repo in enumerate(recent):

                  y = y_positions[index]

                  repo_name = safe(
                      trim(
                          repo.get(
                              "name",
                              "repository"
                          ),
                          30
                      )
                  )

                  language = safe(
                      trim(
                          repo.get("language")
                          or "unknown",
                          14
                      )
                  )

                  stars = int(
                      repo.get(
                          "stargazers_count"
                      ) or 0
                  )


                  rows.append(
                      f'''
                      <g>

                        <text
                          x="82"
                          y="{y}"
                          fill="#39ff88"
                          font-size="11"
                        >
                          {index + 1:02d}
                        </text>

                        <text
                          x="125"
                          y="{y}"
                          fill="#d0d7de"
                          font-size="12"
                        >
                          {repo_name}
                        </text>

                        <text
                          x="515"
                          y="{y}"
                          fill="#7d8590"
                          font-size="11"
                        >
                          {language}
                        </text>

                        <text
                          x="690"
                          y="{y}"
                          fill="#7d8590"
                          font-size="11"
                        >
                          ★ {stars}
                        </text>

                      </g>
                      '''
                  )

          else:

              rows.append(
                  '''
                  <text
                    x="82"
                    y="325"
                    fill="#7d8590"
                    font-size="12"
                  >
                    No public project repositories detected.
                  </text>

                  <text
                    x="82"
                    y="350"
                    fill="#484f58"
                    font-size="10"
                  >
                    Private repositories are intentionally not exposed.
                  </text>
                  '''
              )


          recent_markup = "\n".join(
              rows
          )


          # ======================================================
          # SYNC TIME
          # ======================================================

          sync_time = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d %H:%M UTC"
          )


          # ======================================================
          # SVG
          # ======================================================

          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="1100"
            height="475"
            viewBox="0 0 1100 475"
            role="img"
            aria-labelledby="title desc"
          >

            <title id="title">
              PRAVEEN.OS GitHub Signal
            </title>

            <desc id="desc">
              Live public GitHub statistics for Praveen Nimilka.
            </desc>


            <defs>

              <linearGradient
                id="background"
                x1="0"
                y1="0"
                x2="1"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#090d12"
                />

                <stop
                  offset="100%"
                  stop-color="#0d1117"
                />

              </linearGradient>


              <linearGradient
                id="signal"
                x1="0"
                x2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#39ff88"
                  stop-opacity="0"
                />

                <stop
                  offset="50%"
                  stop-color="#39ff88"
                  stop-opacity=".85"
                />

                <stop
                  offset="100%"
                  stop-color="#39ff88"
                  stop-opacity="0"
                />

              </linearGradient>


              <filter
                id="glow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
              >

                <feGaussianBlur
                  stdDeviation="4"
                  result="blur"
                />

                <feMerge>

                  <feMergeNode
                    in="blur"
                  />

                  <feMergeNode
                    in="SourceGraphic"
                  />

                </feMerge>

              </filter>

            </defs>


            <!-- ==================================================
                 BACKGROUND
            =================================================== -->

            <rect
              x="1"
              y="1"
              width="1098"
              height="473"
              rx="16"
              fill="url(#background)"
              stroke="#30363d"
              stroke-width="2"
            />


            <!-- MOVING TOP SIGNAL -->

            <rect
              x="-300"
              y="1"
              width="300"
              height="2"
              fill="url(#signal)"
            >

              <animate
                attributeName="x"
                from="-300"
                to="1100"
                dur="5s"
                repeatCount="indefinite"
              />

            </rect>


            <g
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            >


              <!-- ==================================================
                   HEADER
              =================================================== -->

              <circle
                cx="80"
                cy="58"
                r="5"
                fill="#39ff88"
                filter="url(#glow)"
              >

                <animate
                  attributeName="opacity"
                  values="1;.2;1"
                  dur="1.7s"
                  repeatCount="indefinite"
                />

              </circle>


              <text
                x="99"
                y="63"
                fill="#39ff88"
                font-size="12"
                letter-spacing="2"
              >
                GITHUB SIGNAL // LIVE
              </text>


              <text
                x="1018"
                y="62"
                text-anchor="end"
                fill="#484f58"
                font-size="9"
                letter-spacing="1"
              >
                PRAVEEN.OS
              </text>


              <!-- ==================================================
                   COMMAND
              =================================================== -->

              <text
                x="80"
                y="108"
                fill="#39ff88"
                font-size="12"
              >
                praveen@github
              </text>


              <text
                x="202"
                y="108"
                fill="#7d8590"
                font-size="12"
              >
                :~$
              </text>


              <text
                x="236"
                y="108"
                fill="#d0d7de"
                font-size="12"
              >
                ./signal --live
              </text>


              <text
                x="1018"
                y="108"
                text-anchor="end"
                fill="#30363d"
                font-size="9"
              >
                {safe(sync_time)}
              </text>


              <line
                x1="80"
                y1="132"
                x2="1018"
                y2="132"
                stroke="#21262d"
              />


              <!-- ==================================================
                   STAT LABELS
              =================================================== -->

              <text
                x="80"
                y="176"
                fill="#7d8590"
                font-size="9"
                letter-spacing="1.6"
              >
                PUBLIC REPOS
              </text>


              <text
                x="330"
                y="176"
                fill="#7d8590"
                font-size="9"
                letter-spacing="1.6"
              >
                TOTAL STARS
              </text>


              <text
                x="570"
                y="176"
                fill="#7d8590"
                font-size="9"
                letter-spacing="1.6"
              >
                FOLLOWERS
              </text>


              <text
                x="810"
                y="176"
                fill="#7d8590"
                font-size="9"
                letter-spacing="1.6"
              >
                SYSTEM
              </text>


              <!-- ==================================================
                   STAT VALUES
              =================================================== -->

              <text
                x="80"
                y="218"
                fill="#f0f6fc"
                font-size="30"
                font-weight="700"
              >
                {public_repo_count}
              </text>


              <text
                x="330"
                y="218"
                fill="#f0f6fc"
                font-size="30"
                font-weight="700"
              >
                {total_stars}
              </text>


              <text
                x="570"
                y="218"
                fill="#f0f6fc"
                font-size="30"
                font-weight="700"
              >
                {followers}
              </text>


              <text
                x="810"
                y="218"
                fill="#39ff88"
                font-size="28"
                font-weight="700"
              >
                ONLINE
              </text>


              <!-- ==================================================
                   SUB SIGNAL
              =================================================== -->

              <text
                x="80"
                y="252"
                fill="#484f58"
                font-size="9"
                letter-spacing="1.4"
              >
                {safe(language_line)}
              </text>


              <text
                x="1018"
                y="252"
                fill="#484f58"
                text-anchor="end"
                font-size="9"
              >
                FORKS // {total_forks}
              </text>


              <line
                x1="80"
                y1="268"
                x2="1018"
                y2="268"
                stroke="#21262d"
              />


              <!-- ==================================================
                   RECENT PROJECTS
              =================================================== -->

              <text
                x="80"
                y="289"
                fill="#484f58"
                font-size="9"
                letter-spacing="1.6"
              >
                RECENT PUBLIC PROJECTS
              </text>


              {recent_markup}


              <!-- ==================================================
                   FOOTER
              =================================================== -->

              <text
                x="80"
                y="447"
                fill="#30363d"
                font-size="9"
                letter-spacing="1.4"
              >
                DATA // GITHUB PUBLIC API
              </text>


              <text
                x="1018"
                y="447"
                fill="#30363d"
                text-anchor="end"
                font-size="9"
                letter-spacing="1"
              >
                PRIVATE DATA // NOT EXPOSED
              </text>


              <!-- BLINKING CURSOR -->

              <rect
                x="1012"
                y="417"
                width="7"
                height="14"
                fill="#39ff88"
              >

                <animate
                  attributeName="opacity"
                  values="1;0;1"
                  dur="1s"
                  repeatCount="indefinite"
                />

              </rect>

            </g>

          </svg>'''


          # ======================================================
          # WRITE ASSET
          # ======================================================

          with open(
              "assets/github-signal.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(svg)


          print("")
          print("PRAVEEN.OS signal generated")
          print("----------------------------")
          print(f"Owner:        {OWNER}")
          print(f"Public repos: {public_repo_count}")
          print(f"Stars:        {total_stars}")
          print(f"Followers:    {followers}")
          print(f"Projects:     {len(project_repos)}")
          print("")

          PYTHON


      # ==========================================================
      # 3. COMMIT SIGNAL ASSET TO MAIN
      # ==========================================================

      - name: Commit updated GitHub signal
        shell: bash
        run: |
          set -e

          git config user.name "praveen-os[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-signal.svg

          if git diff --cached --quiet; then
            echo "No signal changes to commit."
          else
            git commit -m "chore: refresh PRAVEEN.OS signal [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi


      # ==========================================================
      # 4. GENERATE CONTRIBUTION SNAKE
      # ==========================================================

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#39ff88&color_dots=#0d1117,#123524,#176b3a,#26a65b,#39ff88
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#39ff88&color_dots=#0d1117,#123524,#176b3a,#26a65b,#39ff88


      # ==========================================================
      # 5. PUBLISH SNAKE TO OUTPUT BRANCH
      # ==========================================================

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
